<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Currency Converter</h1>
      <div class="input-box">
        <label class="text">Amount</label>
        <input
          type="number"
          class="amount"
          placeholder="Enter amount.."
          required
        />
        <label class="text" for="fromCurrency">From</label>
        <select class="select1" id="fromCurrency">
          <option value="NPR">Nepalese Rupee</option>
          <option value="USD">Us Dollar</option>
          <option value="EUR">Euro</option>
          <option value="INR">Indian Rupee</option>
          <option value="CAD">Canadian Dollar</option>
          <option value="AUD">Australian Dollar</option>
          <option value="JPY">Japanese Yuan</option>
          <option value="SGD">Singapore Dollar</option>
          <option value="CNY">Chinese yuan</option>
        </select>
        <label class="text" for="toCurrency">To</label>
        <select class="select2" id="toCurrency">
          <option value="USD">Us Dollar</option>
          <option value="NPR">Nepalese Rupee</option>
          <option value="EUR">Euro</option>
          <option value="INR">Indian Rupee</option>
          <option value="CAD">Canadian Dollar</option>
          <option value="AUD">Australian Dollar</option>
          <option value="JPY">Japanese Yuan</option>
          <option value="SGD">Singapore Dollar</option>
          <option value="CNY">Chinese yuan</option>
        </select>
        <button>Convert</button>
      </div>
      <div class="result">
        <p id="errorMessage"></p>
        <h2 id="convertedAmount"></h2>
        <p id="currencyPair"></p>
        <p id="rate"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
